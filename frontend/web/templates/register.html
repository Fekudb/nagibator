<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Детектор токсичных комментариев</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация</h1>
        <p class="subtitle">Нагибатор диванных критиков</p>

        <div class="auth-form">
            <input type="text" id="username" class="auth-input" placeholder="Имя пользователя (мин. 3 символа)">
            <input type="password" id="password" class="auth-input" placeholder="Пароль (мин. 4 символа)">

            <div class="gender-select">
                <label class="gender-label">Пол:</label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="male"> Мужской
                </label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="female"> Женский
                </label>
            </div>

            <div class="error-area" id="errorArea"></div>

            <button class="btn-check" onclick="doRegister()">Зарегистрироваться</button>

            <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
        </div>
    </div>

    <script>
        function doRegister() {
            var username = document.getElementById("username").value.trim();
            var password = document.getElementById("password").value;
            var genderEl = document.querySelector('input[name="gender"]:checked');
            var errorArea = document.getElementById("errorArea");
            errorArea.style.display = "none";

            if (!username || !password || !genderEl) {
                errorArea.textContent = "Заполните все поля и выберите пол";
                errorArea.style.display = "block";
                return;
            }

            if (username.length < 3) {
                errorArea.textContent = "Имя пользователя — минимум 3 символа";
                errorArea.style.display = "block";
                return;
            }

            if (password.length < 4) {
                errorArea.textContent = "Пароль — минимум 4 символа";
                errorArea.style.display = "block";
                return;
            }

            fetch("/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    username: username,
                    password: password,
                    gender: genderEl.value
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    errorArea.textContent = data.error;
                    errorArea.style.display = "block";
                } else {
                    window.location.href = "/";
                }
            })
            .catch(function() {
                errorArea.textContent = "Ошибка соединения с сервером";
                errorArea.style.display = "block";
            });
        }

        document.getElementById("password").addEventListener("keydown", function(e) {
            if (e.key === "Enter") doRegister();
        });
    </script>
</body>
</html>
